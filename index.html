  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .top{position:fixed;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="firebase-config.js"></script>
<script>
/* Firebase 연결부: 페이지가 쓰는 room / db / user 기능을 Firebase로 연결해요.
   firebase-config.js가 비어 있으면 혼자 관람 모드로 동작해요. */
(function(){
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||!window.firebase) return;
  firebase.initializeApp(cfg);
  const auth=firebase.auth(), rtdb=firebase.database(), TS=firebase.database.ServerValue.TIMESTAMP;
  let offset=0; rtdb.ref('.info/serverTimeOffset').on('value',s=>{ offset=s.val()||0; });
  const now=()=>Date.now()+offset;
  const ready=auth.signInAnonymously().then(c=>c.user.uid).catch(e=>{ console.warn('익명 로그인 실패',e); return null; });

  function makeRoom(uid){
    const myRef=rtdb.ref('players/'+uid);
    myRef.onDisconnect().remove();
    let mine={}, timer=null, last=0, peers=[];
    const listeners=[];
    function clean(o){ const r={}; for(const k in o){ const v=o[k];
        if(typeof v==='number'){ if(isFinite(v)) r[k]=v; } else if(typeof v==='string'||typeof v==='boolean') r[k]=v; } return r; }
    function flush(){ timer=null; last=Date.now();
      try{ myRef.set(Object.assign(clean(mine),{h:TS})).catch(()=>{}); }catch(e){ console.warn(e); } }
    setInterval(()=>{ if(Object.keys(mine).length) flush(); },20000);   // 살아있다는 신호
    rtdb.ref('players').on('value',snap=>{
      const list=[], t=now();
      snap.forEach(ch=>{
        const v=ch.val()||{};
        if(typeof v.h==='number' && t-v.h>90000) return;     // 오래된 접속은 숨김
        const me=ch.key===uid;
        list.push({peer:ch.key, by:ch.key, isMe:me, sameTab:me, kind:'viewer', guest:false, presence:v, updatedAt:Date.now()});
      });
      peers=list;
      listeners.forEach(f=>{ try{ f({peers:list,joined:[],left:[],updated:[]}); }catch(e){} });
    });
    return {
      presence(patch){
        for(const k in patch){ if(patch[k]===null) delete mine[k]; else mine[k]=patch[k]; }
        if(!timer){ timer=setTimeout(flush, Math.max(0,250-(Date.now()-last))); }   // 초당 최대 4번
        return Promise.resolve();
      },
      onPeers(fn){ listeners.push(fn); return ()=>{}; },
      peers(){ return peers; },
      emit(){ return Promise.resolve(); }, on(){ return ()=>{}; },
      connected(){ return true; }
    };
  }
  function makeDb(uid){
    function coll(path){
      let lim=100;
      const q={
        orderBy(){ return q; },
        limit(n){ lim=n; return q; },
        onSnapshot(cb,err){
          const r=rtdb.ref(path).orderByChild('ts').limitToLast(lim);
          const h=s=>{ const docs=[]; s.forEach(ch=>{ const v=ch.val(); docs.push({id:ch.key, exists:true, data:()=>v}); });
            docs.reverse(); cb({docs, size:docs.length, empty:!docs.length}); };
          r.on('value',h,e=>{ if(err) err({code:'unavailable',message:String(e)}); });
          return ()=>r.off('value',h);
        },
        add(obj){ return rtdb.ref(path).push(Object.assign({},obj,{u:uid, ts:TS})); }
      };
      return q;
    }
    return { collection:coll, doc(p){ return { delete(){ return rtdb.ref(p).remove(); } }; } };
  }
  let cache=null;
  window.claude={ use(name){
    return ready.then(uid=>{
      if(!uid) return null;
      cache=cache||{ room:makeRoom(uid), db:makeDb(uid), user:{ id:async()=>uid, isOwner:async()=>false, can:async()=>true } };
      return cache[name]||null;
    });
  } };
})();
</script>

function tex(c, repeat){
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=MAXANI;
  if(repeat){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat[0],repeat[1]); }
  return t;
}
function mk(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function drawPaw(ctx,x,y,s,color){
  ctx.fillStyle=color;
  const e=(cx,cy,rx,ry)=>{ctx.beginPath();ctx.ellipse(x+cx*s,y+cy*s,rx*s,ry*s,0,0,Math.PI*2);ctx.fill();};
  e(0,16,22,19); e(-28,-10,9,12); e(-11,-26,9,12); e(11,-26,9,12); e(28,-10,9,12);
}

    x.beginPath(); x.moveTo(14,-30); x.lineTo(28,-42); x.lineTo(28,-20); x.closePath(); x.fill();

    x.fillStyle='rgba(240,120,160,.5)'; x.beginPath(); x.arc(-20,8,5,0,Math.PI*2); x.arc(20,8,5,0,Math.PI*2); x.fill();
    x.restore();

const NOTE_COLS=['#fff1a8','#ffd6e0','#d4f0d0','#d6e6ff','#ffe2c2','#ecdcff'];
function wrapText(x,text,maxW,maxLines){
  const out=[]; let line='';
  for(const ch of String(text)){ const t=line+ch; if(x.measureText(t).width>maxW && line){ out.push(line); line=ch; if(out.length===maxLines) break; } else line=t; }
  if(out.length<maxLines && line) out.push(line);
  if(out.length===maxLines && (out.join('').length<String(text).length)) out[maxLines-1]=out[maxLines-1].slice(0,-1)+'…';
  return out;
}
function boardCanvas(list){
  const c=mk(BW,BH), x=c.getContext('2d'); x.scale(BW/LW,BW/LW);
  x.fillStyle='#c9a879'; x.fillRect(0,0,LW,LH);
  for(let i=0;i<2500;i++){ x.fillStyle=`rgba(120,85,50,${Math.random()*.15})`; x.fillRect(Math.random()*LW,Math.random()*LH,4,4); }
  x.textAlign='center';
  const COLS=16, sc=0.78, cw=LW/COLS, rows=Math.floor((LH-50)/(260*sc+18));
  const items=list.slice(0,COLS*rows);
  if(!items.length){ x.font="60px 'Gowun Dodum', sans-serif"; x.fillStyle='#5a4636'; x.fillText('첫 번째 응원을 남겨주세요',LW/2,LH/2+40); }
  items.forEach((e,i)=>{ const col=i%COLS, row=Math.floor(i/COLS);
    x.save(); x.translate(col*cw+(cw-300*sc)/2, 40+row*(260*sc+18)); x.scale(sc,sc); drawNote(x,e,i,0,0); x.restore(); });
  return c;
}
function drawNote(x,e,i,nx,ny){
  x.save(); x.translate(nx+150,ny+125); x.rotate((((i*37)%7)-3)*0.012); x.translate(-150,-125);
  x.fillStyle='rgba(0,0,0,.18)'; x.fillRect(6,8,300,250);
  x.fillStyle=NOTE_COLS[i%NOTE_COLS.length]; x.fillRect(0,0,300,250);
  x.fillStyle='#c0392b'; x.beginPath(); x.arc(150,14,9,0,Math.PI*2); x.fill();
  x.fillStyle='#3b2f2a'; x.textAlign='left'; x.font="34px 'Gowun Dodum', sans-serif";
  wrapText(x,e.shown,256,4).forEach((ln,k)=>x.fillText(ln,22,70+k*44));
  x.font="26px 'Gowun Dodum', sans-serif"; x.fillStyle='#7a6656'; x.textAlign='right';
  x.fillText('- '+e.name,280,232);
  x.restore();
}

function updateItems(dt,t){
  ['churu','salmon'].forEach(k=>{
    const f=ITEMS[k].food; f.t+=dt;
    if(f.state==='eating'){ f.s=Math.max(0,1-f.t/2.2); if(f.s<=0){ f.state='gone'; f.t=0; } }
    else if(f.state==='gone'){ f.s=0; if(f.t>5){ f.state='grow'; f.t=0; } }
    else if(f.state==='grow'){ f.s=Math.min(1,f.t/0.6); if(f.s>=1) f.state='idle'; }
    f.g.scale.setScalar(Math.max(0.001,f.s));
  });
  const b=ITEMS.ball.ball; b.t+=dt;
  if(b.state==='out'){ const u=Math.min(1,b.t/0.9); b.g.position.lerpVectors(b.from,b.to,u); b.g.position.y=THREE.MathUtils.lerp(b.from.y,b.to.y,u)+Math.sin(Math.PI*u)*0.35+Math.abs(Math.sin(u*Math.PI*3))*0.08*(1-u);
    b.g.rotation.z-=dt*9; if(u>=1){ b.state='rest'; b.t=0; } }
  else if(b.state==='rest'){ b.g.rotation.z-=dt*2*(1-b.t/1.4); if(b.t>1.4){ b.state='back'; b.t=0; b.from.copy(b.g.position); } }
  else if(b.state==='back'){ const u=Math.min(1,b.t/1.0), e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2; b.g.position.lerpVectors(b.from,b.home,e); b.g.position.y=THREE.MathUtils.lerp(b.from.y,b.home.y,e)+Math.sin(Math.PI*u)*0.6;
    b.g.rotation.z+=dt*6; if(u>=1){ b.state='idle'; b.g.position.copy(b.home); } }
  // 꾹꾹이 방석: 위에 고양이가 있으면 폭신폭신 눌려요
  kneadTops.forEach((tp,i)=>{
    let on=(myAct.k==='knead'&&myAct.slot===i)||usedSlots('knead').has(i)||NPCS.some(n=>n.act==='knead'&&n.job&&n.job.slot===i);
    const sy=on?0.72+Math.abs(Math.sin(t*5))*0.12:1; tp.scale.y+=(sy-tp.scale.y)*0.25;
  });
  // 쥐 흔들림: 노는 고양이가 있으면 크게
  const players=stayPlayers('wand');
  const amp=players>0?0.22:0.06, sp=players>0?5.5:1.6;

  wandMouse.rotation.y=Math.sin(t*sp)*0.6;
  const arr=wandString.geometry.attributes.position; arr.setXYZ(1,wandMouse.position.x,wandMouse.position.y+0.07,wandMouse.position.z); arr.needsUpdate=true;
}

function stampColor(c){ const f=FURS[c]||FURS[0]; return c===4?'#e79aa6':'#'+f.body.toString(16).padStart(6,'0'); }
function stampCanvas(list){
  const c=mk(BW,BH), x=c.getContext('2d'); x.scale(BW/LW,BW/LW);
  x.fillStyle='#fbf6ee'; x.fillRect(0,0,LW,LH);
  x.strokeStyle='#d8c6ad'; x.lineWidth=16; x.strokeRect(8,8,LW-16,LH-16);
  list.slice().reverse().forEach(s=>{
    const px=s.x*LW, py=(1-s.y)*LH;
    x.save(); x.translate(px,py); x.rotate(((s.ts%13)-6)*0.05);
    drawPaw(x,0,-6,1.3,stampColor(s.c)); x.restore();
    x.font="24px 'Gowun Dodum', sans-serif"; x.fillStyle='rgba(59,47,42,.85)'; x.textAlign='center'; x.fillText(s.n,px,py+52);
  });
  return c;
}
const stampBoard=bigBoard(STX,Math.PI/2,stampCanvas([]),'발도장 존 🐾','판 아무 데나 눌러서 도장을 꾹!');
function redrawStamps(){ stampBoard.material.map=tex(stampCanvas(stamps)); stampBoard.material.needsUpdate=true; }
rebuilders.push(redrawStamps);

function labelSprite(text, bg, fg, scale){
  const c=mk(512,128), x=c.getContext('2d');
  let fs=54; x.font=`700 ${fs}px 'Gowun Dodum', sans-serif`;
  while(x.measureText(text).width>430 && fs>24){ fs-=2; x.font=`700 ${fs}px 'Gowun Dodum', sans-serif`; }
  const w=Math.min(500, x.measureText(text).width+60);
  x.fillStyle=bg; const r=40, x0=(512-w)/2;
  x.beginPath(); x.moveTo(x0+r,14); x.arcTo(x0+w,14,x0+w,114,r); x.arcTo(x0+w,114,x0,114,r); x.arcTo(x0,114,x0,14,r); x.arcTo(x0,14,x0+w,14,r); x.fill();
  x.fillStyle=fg; x.textAlign='center'; x.textBaseline='middle'; x.fillText(text,256,66);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex(c), transparent:true, depthTest:true}));
  s.scale.set(scale*4,scale,1); return s;
}
function makeCat(furIdx){
  const f=FURS[furIdx]||FURS[0];
  if(furIdx===1 && !tabbyTex) tabbyTex=tex(tabbyCanvas());
  const body=furIdx===1 ? new THREE.MeshStandardMaterial({map:tabbyTex, roughness:.85}) : new THREE.MeshStandardMaterial({color:f.body, roughness:.85});
  const acc=new THREE.MeshStandardMaterial({color:f.acc, roughness:.85});
  const dark=new THREE.MeshStandardMaterial({color:0x1b1512, roughness:.3});
  const pink=new THREE.MeshStandardMaterial({color:0xf0a0a8, roughness:.6});
  const g=new THREE.Group(), rig=new THREE.Group(); g.add(rig);
  const sph=(r,m,x,y,z,sx=1,sy=1,sz=1)=>{ const o=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),m); o.position.set(x,y,z); o.scale.set(sx,sy,sz); rig.add(o); return o; };
  sph(0.36,body,0,0.48,0, 0.85,0.78,1.35);          // 몸
  sph(0.22,acc,0,0.5,-0.3, 0.9,1,0.6);              // 가슴
  const head=new THREE.Group(); head.position.set(0,0.86,-0.42); rig.add(head);
  const hm=(r,m,x,y,z,sx=1,sy=1,sz=1)=>{ const o=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),m); o.position.set(x,y,z); o.scale.set(sx,sy,sz); head.add(o); return o; };
  hm(0.3,body,0,0,0, 1.08,0.95,1);
  hm(0.13,acc,0,-0.08,-0.22, 1.25,0.8,0.8);          // 주둥이
  hm(0.045,dark,-0.11,0.04,-0.265); hm(0.045,dark,0.11,0.04,-0.265);  // 눈
  hm(0.012,acc,-0.095,0.06,-0.305); hm(0.012,acc,0.125,0.06,-0.305);
  hm(0.028,pink,0,-0.04,-0.33);                     // 코
  [-1,1].forEach(s=>{
    const ear=new THREE.Mesh(new THREE.ConeGeometry(0.11,0.2,4), body); ear.position.set(s*0.17,0.26,-0.02); ear.rotation.set(0,Math.PI/4,s*-0.3); head.add(ear);
    const inner=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.12,4), pink); inner.position.set(s*0.165,0.25,-0.06); inner.rotation.set(-0.15,Math.PI/4,s*-0.3); head.add(inner);
  });
  const legs=[];
  [[-0.16,-0.3],[0.16,-0.3],[-0.16,0.32],[0.16,0.32]].forEach(([x,z])=>{
    const l=new THREE.Group(); l.position.set(x,0.32,z); rig.add(l);
    const m=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.065,0.3,10), body); m.position.y=-0.15; l.add(m);
    const pawm=new THREE.Mesh(new THREE.SphereGeometry(0.08,10,8), acc); pawm.position.y=-0.3; pawm.scale.set(1,0.6,1.2); l.add(pawm);
    legs.push(l);
  });
  const tail=new THREE.Group(); tail.position.set(0,0.6,0.46); rig.add(tail);
  let prev=tail;
  for(let k=0;k<4;k++){
    const seg=new THREE.Group(); seg.position.y=k===0?0:0.17; prev.add(seg);
    const m=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.055,0.19,8), k===3&&furIdx===5?acc:body); m.position.y=0.085; seg.add(m);
    seg.rotation.x=k===0?0.9:-0.15; prev=seg;
  }
  const shadow=new THREE.Mesh(new THREE.CircleGeometry(0.5,24), new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:.22, depthWrite:false}));
  shadow.rotation.x=-Math.PI/2; shadow.position.y=0.01; shadow.scale.set(0.8,1.3,1); g.add(shadow);
  g.userData={rig,head,legs,tail,phase:Math.random()*6};
  return g;
}

function joyMove(e){
  const r=joy.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=e.clientX-cx, dy=e.clientY-cy; const max=r.width/2-14, d=Math.hypot(dx,dy);
  if(d>max){ dx*=max/d; dy*=max/d; }
  knob.style.transform=`translate(${dx}px,${dy}px)`; jx=dx/max; jy=dy/max;
}

const looks=new Map();
canvas.addEventListener('pointerdown',e=>{ looks.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:0}); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{
  const p=looks.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY; p.moved+=Math.abs(dx)+Math.abs(dy);
  const k=e.pointerType==='mouse'?0.0045:0.0058;
  me.yaw-=dx*k; me.pitch=Math.max(-0.12,Math.min(1.15,me.pitch+dy*k));
  if(p.moved>20) hideHint();
});
const lookEnd=e=>{ const p=looks.get(e.pointerId); looks.delete(e.pointerId); if(p&&p.moved<8) tap(e.clientX,e.clientY); };
canvas.addEventListener('pointerup',lookEnd); canvas.addEventListener('pointercancel',e=>looks.delete(e.pointerId));

const ray=new THREE.Raycaster(), v2=new THREE.Vector2();
function tap(x,y){
  v2.set(x/innerWidth*2-1, -(y/innerHeight)*2+1); ray.setFromCamera(v2,camera);
  const sh=ray.intersectObject(stampBoard)[0];
  if(sh && sh.distance<16 && sh.uv){ addStamp(sh.uv.x, sh.uv.y); return; }
  const hit=ray.intersectObjects(photoMeshes)[0];
  if(hit && hit.distance<12) openLight(hit.object.userData.index);
}

function collide(nx,nz){
  nz=Math.max(PZ1+0.4+R,Math.min(Z0-R,nz));
  if(nz>Z1+R){ nx=Math.max(-W/2+R,Math.min(W/2-R,nx)); }          // 복도
  else if(nz>Z1-0.3-R){                                             // 문 지나는 중
    if(Math.abs(nx)>DOOR/2-R) return null;
  } else { nx=Math.max(-PL+0.4+R,Math.min(PL-0.4-R,nx)); }          // 광장
  for(const o of OBST){ if(nx>o.x0-R&&nx<o.x1+R&&nz>o.z0-R&&nz<o.z1+R) return null; }
  return [nx,nz];
}
function step(dt){
  let f=0,s=0;
  if(keys.KeyW||keys.ArrowUp) f+=1; if(keys.KeyS||keys.ArrowDown) f-=1;
  if(keys.KeyD) s+=1; if(keys.KeyA) s-=1;
  if(!myAct.k){ if(keys.ArrowLeft) me.yaw+=dt*1.8; if(keys.ArrowRight) me.yaw-=dt*1.8; }
  f+=-jy; s+=jx;
  const mag=Math.min(1,Math.hypot(f,s));
  if(myAct.k && mag>0.2 && clock.elapsedTime-myAct.t0>0.25) endAct();   // 조이스틱을 밀면 바로 행동 끝내고 걷기
  if(myAct.k){ me.walking=false; return 0; }
  me.walking=mag>0.08;
  if(!me.walking) return 0;
  const n=Math.hypot(f,s); f/=n; s/=n;
  const fx=-Math.sin(me.yaw), fz=-Math.cos(me.yaw), rx=Math.cos(me.yaw), rz=-Math.sin(me.yaw);
  const vx=(fx*f+rx*s)*SPEED*mag*dt, vz=(fz*f+rz*s)*SPEED*mag*dt;
  me.catYaw=Math.atan2(-vx,-vz);
  let r=collide(me.x+vx, me.z+vz);
  if(!r) r=collide(me.x+vx, me.z) || collide(me.x, me.z+vz);
  if(r){ me.x=r[0]; me.z=r[1]; }
  return mag;
}

/* ================== 가까운 액자 ================== */
const near=document.getElementById('near');
let nearIdx=-1;
function checkNear(){
  let best=-1, bd=1e9;
  const fx=-Math.sin(me.yaw), fz=-Math.cos(me.yaw);
  for(const fr of frames){
    const dx=fr.x-me.x, dz=fr.z-me.z, d=Math.hypot(dx,dz);
    if(d>4.6) continue;
    const dot=(dx*fx+dz*fz)/d; if(dot<0.45) continue;
    if(d<bd){ bd=d; best=fr.i; }
  }
  // 책상 위 물건이 제일 우선
  let ib=null, ibd=1.9;
  for(const k in ITEMS){ if(ITEMS[k].hidden) continue; const p=ITEMS[k].pos, d=Math.hypot(p.x-me.x,p.z-me.z); if(d<ibd){ ibd=d; ib=k; } }
  if(STAY[myAct.k]) ib=myAct.k.startsWith('tw')?'tower':myAct.k;
  if(ib) best=ib;
  if(Math.abs(me.x)<2.2 && me.z>WSZ && me.z<WSZ+4.2 && (typeof best!=='string')) best=-5;   // 입구 안내판
  if(best===-1 && Math.abs(me.x-DX)<2.6 && me.z>DZ && me.z<DZ+3.6) best=-6;   // 사랑이 일기 근처
  if(best===-1 && nearBig(GBX)) best=-8;   // 방명록 근처
  if(best===-1 && nearBig(STX)) best=-7;   // 도장존 근처
  if(best===-1 && Math.hypot(me.x, me.z-SZ)<6.5) best=-9;   // 동상 근처
  if(best!==nearIdx){
    nearIdx=best;
    const btn=document.getElementById('nbtn');
    const extra=document.getElementById('nextra'); extra.textContent='';
    if(best==='tower'){
      document.getElementById('nt').textContent='캣타워';
      btn.style.display='none';
      if(myAct.k.startsWith('tw')){
        document.getElementById('ns').textContent=`${myAct.k.slice(2)}층에서 식빵 굽는 중 🍞`;
        const b=document.createElement('button'); b.textContent='내려오기'; b.onclick=()=>endAct(); extra.appendChild(b);
      } else {
        document.getElementById('ns').textContent='층마다 한 마리씩 식빵 구울 수 있어요';
        ['tw1','tw2','tw3'].forEach((k,i)=>{ const b=document.createElement('button'); b.textContent=`${i+1}층`;
          if(stayPlayers(k)>=1){ b.disabled=true; b.textContent=`${i+1}층 🐱`; }
          b.onclick=()=>doItem(k); extra.appendChild(b); });
      }
      near.classList.add('on');
    }
    else if(typeof best==='string'){ const it=ITEMS[best];
      document.getElementById('nt').textContent=it.title;
      document.getElementById('ns').textContent= STAY[best] ? `${it.sub} · 지금 ${stayPlayers(best)}마리` : it.sub;
      btn.textContent= STAY[best]&&myAct.k===best ? (best==='wand'?'그만 놀기':best==='knead'?'그만하기':it.sit?'일어나기':'그만 긁기') : it.btn;
      if(myAct.k===best) document.getElementById('ns').textContent='조이스틱을 밀면 바로 움직일 수 있어요'; btn.style.display=''; near.classList.add('on'); }
    else if(best===-5){ document.getElementById('nt').textContent='전시관 안내'; document.getElementById('ns').textContent='사랑이 전시관을 만든 이유'; btn.textContent='읽기'; btn.style.display=''; near.classList.add('on'); }
    else if(best===-6){ document.getElementById('nt').textContent='오늘의 사랑이'; document.getElementById('ns').textContent=`${DIARY[DIARY.length-1].date} 소식까지 올라와 있어요`; btn.textContent='일기 보기'; btn.style.display=''; near.classList.add('on'); }
    else if(best===-7){ document.getElementById('nt').textContent='발도장 존'; document.getElementById('ns').textContent='판을 눌러서 도장을 꾹 찍어보세요'; btn.style.display='none'; near.classList.add('on'); }
    else if(best>=0){ near.classList.remove('on'); }
    else if(best===-8){ document.getElementById('nt').textContent='방명록'; document.getElementById('ns').textContent='사랑이에게 한마디 남겨주세요'; btn.textContent='쓰기·보기'; btn.style.display=''; near.classList.add('on'); }
    else if(best===-9){ document.getElementById('nt').textContent=`${MUSEUM.name} 동상`; document.getElementById('ns').textContent=MUSEUM.sub; btn.style.display='none'; near.classList.add('on'); }
    else near.classList.remove('on');
  }
}

/* ================== 멀티플레이 (room) ================== */
let room=null;
const cats=new Map();   // peer -> {g, target, label, bubble, meowAt, name, fur}
function clean(s){ return String(s||'').replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁠-⁯]/g,'').slice(0,16)||'관람객'; }
function num(v,d,lo,hi){ v=Number(v); return isFinite(v)?Math.max(lo,Math.min(hi,v)):d; }
function upsertCat(p){
  const pr=p.presence||{};
  if(!pr.on) { removeCat(p.peer); return; }
  const fur=num(pr.c,0,0,FURS.length-1)|0, name=isBad(clean(pr.n))?'관람객':clean(pr.n);
  let c=cats.get(p.peer);
  if(c && (c.fur!==fur || c.name!==name)){ removeCat(p.peer); c=null; }
  if(!c){
    const g=makeCat(fur);
    const label=labelSprite(name,'rgba(251,247,240,.92)','#3b2f2a',0.3); label.position.y=1.45; g.add(label);
    const x=num(pr.x,0,-PL,PL), z=num(pr.z,0,PZ1,Z0);
    g.position.set(x,0,z); scene.add(g);
    c={g,label,bubble:null,fur,name,tx:x,tz:z,tyaw:num(pr.y,0,-1e4,1e4),walk:false,meowAt:num(pr.m,0,0,9e15),
       act:'',lastAi:num(pr.ai,0,0,9e15),actT0:-99,slot:-1};
    g.rotation.y=c.tyaw; cats.set(p.peer,c);
  }
  c.tx=num(pr.x,c.tx,-PL,PL); c.tz=num(pr.z,c.tz,PZ1,Z0); c.tyaw=num(pr.y,c.tyaw,-1e4,1e4); c.walk=!!pr.w;
  const m=num(pr.m,0,0,9e15);
  if(m && m!==c.meowAt){ c.meowAt=m; showBubble(c, num(pr.q,0,0,NICE.length-1)|0); }
  const a=typeof pr.a==='string'&&ITEMS[pr.a]?pr.a:'', ai=num(pr.ai,0,0,9e15);
  c.slot=STAY[a]?(num(pr.s,-1,-1,3)|0):-1;
  if(a!==c.act || (a && ai!==c.lastAi)){
    if(a && ai!==c.lastAi){
      c.actT0=clock.elapsedTime;
      if(a==='churu'||a==='salmon') triggerFood(a);
      if(a==='ball') hitBall(ai%2===0?1:-1);
    }
    c.act=a; c.lastAi=ai; if(typeof nearIdx==='string' && (nearIdx===a || STAY[nearIdx] || nearIdx==='tower')) nearIdx=-100;
  }
}
function removeCat(peer){ const c=cats.get(peer); if(!c) return; scene.remove(c.g); cats.delete(peer); }
function showBubble(c,q){
  if(c.bubble) c.g.remove(c.bubble);

let lastSent=0, lastKey='', meowTs=0, meowQ=0;
function sendPresence(force){
  if(!room||!entered) return;
  const now=performance.now();
  if(!force && now-lastSent<90) return;
  const st={on:1, n:me.name, c:me.fur, x:+me.x.toFixed(2), z:+me.z.toFixed(2), y:+me.catYaw.toFixed(2), w:me.walking?1:0, m:meowTs, q:meowQ, a:myAct.k, ai:myAct.ts, s:myAct.slot};
  const key=JSON.stringify(st);
  if(!force && key===lastKey) return;
  lastKey=key; lastSent=now;
  room.presence(st).catch(()=>{});
}

const myAct={k:'',t0:0,dur:0,ts:0,slot:-1};
let eyeH=EYE;
function stayPlayers(k){ let n=myAct.k===k?1:0; cats.forEach(c=>{ if(c.act===k) n++; }); return n; }
function usedSlots(k){ const s=new Set(); cats.forEach(c=>{ if(c.act===k && c.slot>=0) s.add(c.slot); }); return s; }
function setAct(k,dur,sign){
  let ts=Date.now(); if(sign!==undefined && ((ts%2===0)!==(sign>0))) ts++;
  Object.assign(myAct,{k,t0:clock.elapsedTime,dur,ts});
  nearIdx=-100; sendPresence(true);
}
function endAct(){
  const it=ITEMS[myAct.k];
  if(it && it.sit && it.stand[myAct.slot]){ me.x=it.stand[myAct.slot].x; me.z=it.stand[myAct.slot].z; }
  myAct.k=''; myAct.slot=-1; nearIdx=-100; sendPresence(true);
}
function doItem(k){
  if(k==='churu'||k==='salmon'){
    if(myAct.k) return;
    if(!triggerFood(k)){ showToast('다 먹었어요! 조금 뒤에 다시 생겨요'); return; }
    setAct(k,2.6); showToast(k==='churu'?'냠냠… 츄르 최고 😻':'바삭바삭, 연어 맛있다 🐟');
  } else if(k==='ball'){
    if(myAct.k) return;
    const sign=Math.random()<.5?-1:1;
    if(!hitBall(sign)){ showToast('털공이 굴러가는 중이에요'); return; }
    setAct('ball',1.3,sign); showToast('툭! 데굴데굴~');
  } else if(STAY[k]){
    if(myAct.k===k){ endAct(); return; }
    if(myAct.k && myAct.k.startsWith('tw') && k.startsWith('tw')) endAct();
    if(myAct.k) return;
    const MAX=STAY[k].length;
    if(stayPlayers(k)>=MAX){ showToast(MAX===1?'다른 고양이가 이미 있어요':`자리가 꽉 찼어요 (최대 ${MAX}마리)`); return; }
    const used=usedSlots(k); let s=0; while(used.has(s)) s++;
    if(s>=MAX){ showToast(`자리가 꽉 찼어요 (최대 ${MAX}마리)`); return; }
    myAct.slot=s; setAct(k,Infinity); showToast(k==='wand'?'쥐 잡자! 🐭':k==='knead'?'꾹꾹… 꾹꾹… 골골송 부르는 중 🎵':k.startsWith('tw')?`${k.slice(2)}층에서 식빵 굽는 중… 🍞`:ITEMS[k].sit?'식빵 굽는 중… 🍞':'벅벅벅! 시원하다 😼');
  }
}

function angLerp(a,b,t){ let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI; return a+d*t; }
/* ================== 안내 고양이 (각자 화면에서 돌아다녀요) ================== */
const NPCS=[];
function npcFree(x,z,area){
  const m=0.7;
  if(area==='hall'){ if(x<-W/2+1.2||x>W/2-1.2||z<Z1+2||z>Z0-1.5) return false; }
  else { if(x<-PL+1.5||x>PL-1.5||z<PZ1+1.5||z>Z1-2.5) return false; }
  for(const o of OBST){ if(x>o.x0-m&&x<o.x1+m&&z>o.z0-m&&z<o.z1+m) return false; }
  return true;
}
function npcPick(n){
  for(let i=0;i<40;i++){
    const x=n.area==='hall'?(Math.random()*2-1)*(W/2-1.4):(Math.random()*2-1)*(PL-2);
    const z=n.area==='hall'?Z1+2+Math.random()*(Z0-Z1-3.5):PZ1+2+Math.random()*(Z1-PZ1-5);
    let ok=npcFree(x,z,n.area);
    for(let k=1;k<10&&ok;k++){ const u=k/10; ok=npcFree(n.x+(x-n.x)*u, n.z+(z-n.z)*u, n.area); }
    if(ok){ n.goal={x,z}; return; }
  }
  n.goal=null;
}

/* 안내냥이 가끔 놀거리를 써요 (각자 화면에서만, 관람객이 오면 비켜줘요) */
const NPC_ACTS={hall:['churu','salmon','ball','wand'], plaza:['bench0','bench1','bench2','bench3','scrL','scrR','scrCL','scrCR','tw1','tw2','tw3','knead','knead']};
const NPC_APPROACH={churu:[0,-7.9], ball:[0,-12.1], salmon:[0,-24.0]};
function npcPathOk(n,x,z){
  for(let k=1;k<=12;k++){
    const u=k/12, px=n.x+(x-n.x)*u, pz=n.z+(z-n.z)*u;
    if(n.area==='hall'){ if(px<-W/2+0.5||px>W/2-0.5||pz<Z1+0.6||pz>Z0-0.6) return false; }
    else { if(px<-PL+1||px>PL-1||pz<PZ1+1||pz>Z1-0.4) return false; }
    if(u>0.8) continue;
    for(const o of OBST){ if(px>o.x0-0.35&&px<o.x1+0.35&&pz>o.z0-0.35&&pz<o.z1+0.35) return false; }
  }
  return true;
}
function slotTaken(k,i,self){
  if(myAct.k===k && myAct.slot===i) return true;
  if(usedSlots(k).has(i)) return true;
  return NPCS.some(o=>o!==self && o.job && o.job.k===k && o.job.slot===i);
}
function npcTryJob(n){
  const list=NPC_ACTS[n.area].slice().sort(()=>Math.random()-0.5);
  for(const k of list){
    const it=ITEMS[k]; if(!it) continue;
    if(STAY[k]){
      const free=STAY[k].map((_,i)=>i).filter(i=>!slotTaken(k,i,n));
      if(!free.length) continue;
      const i=free[Math.floor(Math.random()*free.length)], sp=STAY[k][i];
      const ap=it.stand?it.stand[i]:sp;
      if(!npcPathOk(n,ap.x,ap.z)) continue;
      const dur=it.sit?12+Math.random()*10:k==='wand'?6+Math.random()*5:4+Math.random()*4;
      n.job={k,slot:i,ap:{x:ap.x,z:ap.z},sp,dur,phase:'go',t:0}; return true;
    } else if(NPC_APPROACH[k]){
      const [ax,az]=NPC_APPROACH[k];
      if(k==='ball' && ITEMS.ball.ball.state!=='idle') continue;
      if(!npcPathOk(n,ax,az)) continue;
      n.job={k,slot:-1,ap:{x:ax,z:az},sp:null,dur:k==='ball'?1.4:2.8,phase:'go',t:0}; return true;
    }
  }
  return false;
}
function npcEndJob(n){
  const j=n.job; if(!j) return;
  const it=ITEMS[j.k];
  if(it && it.sit && it.stand){ const st=it.stand[j.slot]||it.stand[0]; n.x=st.x; n.z=st.z; }
  n.act=''; n.job=null; n.wait=2+Math.random()*3; n.walk=false;
}
function npcMoveTo(n,x,z,dt){
  const gx=x-n.x, gz=z-n.z, gd=Math.hypot(gx,gz);
  if(gd<0.12) return true;
  const sp=Math.min(gd,1.1*dt); n.x+=gx/gd*sp; n.z+=gz/gd*sp; n.tyaw=Math.atan2(-gx,-gz); n.walk=true;
  return false;
}
function updateNpcs(dt,t){
  NPCS.forEach(n=>{
    const dx=me.x-n.x, dz=me.z-n.z, d=Math.hypot(dx,dz);
    const near=entered && d<5;
    n.bubble.visible=near; if(near) n.bubble.position.y=1.88+(n.g.position.y)+Math.sin(t*3)*0.03;
    const j=n.job;
    if(j){
      n.walk=false;
      if(j.sp && slotTaken(j.k,j.slot,n)){ npcEndJob(n); }            // 관람객이 오면 비켜줘요
      else if(j.phase==='go'){
        if(npcMoveTo(n,j.ap.x,j.ap.z,dt)){
          j.phase='do'; j.t=0; n.act=j.k; n.actT0=t; n.walk=false;
          if(j.k==='ball'){ const sign=Math.random()<.5?-1:1; if(!hitBall(sign)){ npcEndJob(n); } }
        }
      } else {
        j.t+=dt;
        if(j.sp){ n.x+=(j.sp.x-n.x)*Math.min(1,dt*4); n.z+=(j.sp.z-n.z)*Math.min(1,dt*4); }
        if(j.t>j.dur) npcEndJob(n);
      }
    }
    else if(near && d<3){ n.walk=false; n.tyaw=Math.atan2(-dx,-dz); n.wait=Math.max(n.wait,1.5); }   // 가까이 오면 멈춰서 쳐다봐요
    else if(n.wait>0){ n.wait-=dt; n.walk=false; if(n.wait<=0){ if(!(Math.random()<0.45 && npcTryJob(n))) npcPick(n); } }
    else if(n.goal){
      if(npcMoveTo(n,n.goal.x,n.goal.z,dt)){ n.goal=null; n.wait=2+Math.random()*4; n.walk=false; }
    } else { n.wait=1; }
    n.tx=n.x; n.tz=n.z;
    animCat(n,dt,t);
  });
}
function animCat(c,dt,t){
    const g=c.g, u=g.userData, k=1-Math.pow(0.001,dt);
    const dx=c.tx-g.position.x, dz=c.tz-g.position.z, moving=c.walk||(!c.self&&Math.hypot(dx,dz)>0.05);
    if(c.self){ g.position.x=c.tx; g.position.z=c.tz; } else { g.position.x+=dx*k*0.9; g.position.z+=dz*k*0.9; }
    // 행동 중이면 물건 쪽을 바라봄
    const ael=t-c.actT0;
    let mode='';
    if(c.act==='wand') mode='play';
    else if((c.act==='churu'||c.act==='salmon') && ael<2.8) mode='eat';
    else if(c.act==='ball' && ael<1.4) mode='bat';
    else if(c.act.startsWith('scr')) mode='scratch';
    else if(c.act==='knead') mode='knead';
    else if(c.act.startsWith('bench')||c.act.startsWith('tw')) mode='sit';
    let yawT=c.tyaw;
    if(mode==='sit'||mode==='knead') yawT=ITEMS[c.act].yaw;
    else if(mode){ const ip=c.act==='wand'?wandMouse.position:c.act==='ball'?ITEMS.ball.pos:ITEMS[c.act].pos; yawT=Math.atan2(-(ip.x-g.position.x),-(ip.z-g.position.z)); }
    g.rotation.y=angLerp(g.rotation.y,yawT,k);
    u.phase+=dt*(moving&&!mode?10:0);
    let rigX=0, headX=0, rigY=moving?Math.abs(Math.sin(u.phase))*0.04:Math.sin(t*2+u.phase)*0.006;
    u.legs.forEach((l,i)=>{
      let tgt=moving&&!mode?Math.sin(u.phase+(i%2===(i<2?0:1)?0:Math.PI))*0.55:0;
      if(mode==='bat' && i===1) tgt=Math.max(0,Math.sin(Math.min(1,ael/0.5)*Math.PI))*1.5;
      if(mode==='scratch' && i<2) tgt=1.6+Math.sin(t*14+(i?Math.PI:0))*0.45;
      if(mode==='knead') tgt= i<2 ? -0.1+Math.max(0,Math.sin(t*5+(i?Math.PI:0)))*0.75 : 0.5;
      if(mode==='play' && i<2) tgt=0.8+Math.max(0,Math.sin(t*6+(i?Math.PI:0)))*0.9;
      l.rotation.x+=(tgt-l.rotation.x)*0.3;
      const ls=mode==='sit'?0.12:mode==='knead'?(i<2?0.85:0.45):1; l.scale.y+=(ls-l.scale.y)*0.2;   // 식빵: 다리 쏙
    });
    if(mode==='eat'){ rigX=-0.22; headX=-0.35+Math.sin(t*9)*0.12; }
    if(mode==='scratch'){ rigX=0.6; rigY=0.12; }
    if(mode==='sit'){ rigY=-0.2+Math.sin(t*1.6)*0.006; headX=-0.12; }
    if(mode==='knead'){ rigX=-0.08; rigY=-0.1+Math.abs(Math.sin(t*5))*0.025; headX=0.12+Math.sin(t*2.5)*0.05; }
    if(mode==='play'){ rigX=0.38; rigY=0.08+Math.abs(Math.sin(t*3))*0.1; }
    u.rig.rotation.x+=(rigX-u.rig.rotation.x)*0.15;
    u.rig.position.y=rigY;
    const gy=(mode==='sit'||mode==='knead')?(ITEMS[c.act].sitY||0.5):0; g.position.y+=(gy-g.position.y)*0.2;   // 벤치 위로
    u.head.rotation.x+=(headX-u.head.rotation.x)*0.2;
    u.tail.rotation.z=Math.sin(t*(moving||mode==='play'?5:2)+u.phase)*0.35;
    u.head.rotation.y=mode?0:Math.sin(t*0.7+u.phase)*0.15;
    if(mode==='knead') u.tail.rotation.z=Math.sin(t*1.2+u.phase)*0.15;
    if(c.bubble){ c.bubbleT-=dt; c.bubble.position.y=1.85+Math.sin(t*6)*0.03; if(c.bubbleT<=0){ g.remove(c.bubble); c.bubble=null; } }
}
const camTgt=new THREE.Vector3(), camDir=new THREE.Vector3(), camRay=new THREE.Raycaster(); let camDist=3.4;
function loop(){
  requestAnimationFrame(loop);
  try{ frame(); }catch(e){ console.warn(e); }
}
function frame(){
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  if(entered && !light.classList.contains('on') && !gbEl.classList.contains('on') && !diaryEl.classList.contains('on')){ const mg=step(dt); bob+=dt*mg*9; } else me.walking=false;
  updateMyAct(dt,t); updateItems(dt,t);
  checkNear(); sendPresence(false);
  updateNpcs(dt,t);
  if(myCat){ Object.assign(myCat,{tx:me.x,tz:me.z,tyaw:me.catYaw,walk:me.walking,act:myAct.k,actT0:myAct.t0}); animCat(myCat,dt,t); }
  cats.forEach(c=>animCat(c,dt,t));
  // 3인칭 카메라
  camTgt.set(me.x,0.95+(myCat?myCat.g.position.y:0),me.z);
  let dist=3.4; const cp=Math.cos(me.pitch);
  camDir.set(Math.sin(me.yaw)*cp, Math.sin(me.pitch), Math.cos(me.yaw)*cp);
  camRay.set(camTgt,camDir); camRay.far=dist+0.3;
  const hb=camRay.intersectObjects(camBlockers)[0];
  if(hb) dist=Math.max(0.5,hb.distance-0.3);
  camDist+=(dist-camDist)*(dist<camDist?1:Math.min(1,dt*3));
  camera.position.copy(camTgt).addScaledVector(camDir,camDist);
  camera.lookAt(camTgt.x,camTgt.y+0.3,camTgt.z);
  renderer.render(scene,camera);
}
(document.fonts?Promise.all([document.fonts.load("700 40px 'Gowun Batang'"),document.fonts.load("40px 'Gowun Dodum'")]):Promise.resolve())
  .catch(()=>{}).then(()=>rebuilders.forEach(f=>f()));
loop();
</script>
